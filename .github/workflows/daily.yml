name: Fetch Bing Wallpaper Daily

on:
  schedule:
    # Запуск каждый день в 02:00 UTC (можно настроить любое время)
    - cron: '0 2 * * *'
  workflow_dispatch: # Позволяет запускать вручную из вкладки Actions

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Разрешаем бота делать коммиты в репозиторий

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch wallpaper
        run: python fetch_bing.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add images/ README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "update: Bing wallpaper for $(date +'%Y-%m-%d')" && git push)
